# Bộ test cũ dựng kế hoạch năm/tổ sau ngày bắt đầu năm học (đồng hồ cố định) ⇒ tắt khóa theo năm học (spec 004);
# lớp EduPlanTimeLockIntegrationTest bật lại để kiểm quy tắc khóa.
carenest:
  eduplan:
    plan-time-lock-enabled: false
  # Worker hàng chờ đẩy, gửi hẹn giờ, lịch lặp (spec 019) không chạy nền trong test; test gọi trực tiếp
  push:
    worker-delay: 1h
  announcement:
    worker-delay: 1h
    schedule-delay: 1h
