spring:
  application:
    name: carenest-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carenest}
    username: ${DB_USERNAME:carenest}
    password: ${DB_PASSWORD:carenest}  # carenest:allow-secret
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Seed dev (R__ trong db/dev) không có khi chạy không profile dev: không coi là lỗi validate
    ignore-migration-patterns: "*:future,repeatable:missing"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 102MB

server:
  port: ${SERVER_PORT:8080}

carenest:
  education-media:
    bucket: ${CARENEST_EDUCATION_MEDIA_BUCKET:}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${CARENEST_EDUCATION_MEDIA_ENDPOINT:}
    path-style: ${CARENEST_EDUCATION_MEDIA_PATH_STYLE:false}
  # Kho tệp dùng chung (spec 017): mỗi loại một thư mục, giới hạn và định dạng đổi ở đây, không sửa code.
  # legacy-prefix: thư mục của tệp cũ (key UUID) — chỉ đọc/xóa, tệp mới theo thư mục + tên mới.
  storage:
    bucket: ${CARENEST_EDUCATION_MEDIA_BUCKET:}
    presign-ttl: ${CARENEST_STORAGE_PRESIGN_TTL:15m}
    # Vùng tạm cho tải trực tiếp chưa xác nhận; lifecycle bucket xóa sau 1 ngày
    tmp-prefix: tmp/
    categories:
      user-avatar:
        folder: avatars/users/
        code: user
        max-size: ${CARENEST_STORAGE_MAX_USER_AVATAR:2MB}
        types: [jpg, png, webp]
        legacy-prefix: ${CARENEST_ACCOUNT_MEDIA_PREFIX:accounts/photos/}
      child-avatar:
        folder: avatars/children/
        code: child
        max-size: ${CARENEST_STORAGE_MAX_CHILD_AVATAR:2MB}
        types: [jpg, png, webp]
        legacy-prefix: children/photos/
      pickup:
        folder: pickups/
        code: pickup
        max-size: ${CARENEST_STORAGE_MAX_PICKUP:3MB}
        types: [jpg, png, webp]
      plan-year-goal:
        folder: plans/year-goals/
        code: yeargoal
        max-size: ${CARENEST_STORAGE_MAX_PLAN:10MB}
        types: [pdf, docx]
      plan-theme:
        folder: plans/themes/
        code: theme
        max-size: ${CARENEST_STORAGE_MAX_PLAN:10MB}
        types: [pdf, docx]
      plan-lesson:
        folder: plans/lessons/
        code: lesson
        max-size: ${CARENEST_STORAGE_MAX_PLAN:10MB}
        types: [pdf, docx]
      meal:
        folder: meals/
        code: meal
        max-size: ${CARENEST_STORAGE_MAX_MEAL:5MB}
        types: [jpg, png, webp]
        legacy-prefix: ${CARENEST_EDUCATION_MEDIA_PREFIX:education/learning-resources/}
      food-sample:
        folder: food-samples/
        code: foodsample
        max-size: ${CARENEST_STORAGE_MAX_FOOD_SAMPLE:5MB}
        types: [jpg, png, webp]
      import:
        folder: imports/
        code: import
        max-size: ${CARENEST_STORAGE_MAX_IMPORT:5MB}
        types: [xlsx]
      learning-resource:
        folder: hoclieu/
        code: hoclieu
        max-size: ${CARENEST_STORAGE_MAX_LEARNING_OTHER:20MB}
        max-size-by-kind:
          image: ${CARENEST_STORAGE_MAX_LEARNING_IMAGE:5MB}
          video: ${CARENEST_STORAGE_MAX_LEARNING_VIDEO:100MB}
        types: [jpg, jpeg, png, gif, webp, mp4, webm, pdf, pptx, docx, xlsx, txt, csv]
        legacy-prefix: ${CARENEST_EDUCATION_MEDIA_PREFIX:education/learning-resources/}
      user-signature:
        folder: signatures/users/
        code: sig
        max-size: ${CARENEST_STORAGE_MAX_SIGNATURE:2MB}
        types: [jpg, png]
        legacy-prefix: ${CARENEST_SIGNATURE_MEDIA_PREFIX:accounts/signatures/}
      inspection-signature:
        folder: signatures/inspections/
        code: inspsig
        max-size: ${CARENEST_STORAGE_MAX_SIGNATURE:2MB}
        types: [jpg, png]
        legacy-prefix: ${CARENEST_INSPECTION_SIGNATURE_MEDIA_PREFIX:meals/inspection-signatures/}
  api:
    # Prefix gắn cho mọi controller trong com.carenest.controller (xem WebMvcConfig)
    prefix: ${API_PREFIX:/api}
  # Múi giờ trường: xác định "hôm nay" khi xét phân công/enrollment còn hiệu lực
  time-zone: ${CARENEST_TIME_ZONE:Asia/Ho_Chi_Minh}
  auth:
    enabled: ${CARENEST_AUTH_ENABLED:false}
    encryption-key: ${CARENEST_AUTH_ENCRYPTION_KEY:}
    assertion-secret: ${KEYCLOAK_AUTH_RECOVERY_ASSERTION_SECRET:}
    client-secret: ${KEYCLOAK_AUTH_GATEWAY_CLIENT_SECRET:}
    secure-cookies: ${CARENEST_AUTH_SECURE_COOKIES:true}
    allowed-origins: ${CARENEST_AUTH_WEB_ORIGIN:http://localhost:5173}
  security:
    jwt:
      # iss phải khớp tuyệt đối với token Keycloak phát hành (KC_HOSTNAME); JWKS có thể lấy qua địa chỉ nội bộ
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/carenest}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/carenest/protocol/openid-connect/certs}
      audience: ${KEYCLOAK_AUDIENCE:carenest-api}
    platform:
      # AUTH-21: client Keycloak (claim azp) ⇒ nền tảng; client lạ hoặc token thiếu azp bị từ chối mọi API
      web-clients: ${CARENEST_WEB_CLIENT_IDS:carenest-auth-gateway,carenest-web}
      mobile-clients: ${CARENEST_MOBILE_CLIENT_IDS:carenest-mobile}
      # Chỉ dev: client lấy token bằng curl, giữ mọi role
      dev-clients: ${CARENEST_DEV_CLIENT_IDS:}
    cors:
      # Danh sách origin, phân tách bằng dấu phẩy; không dùng "*"
      allowed-origins: ${CARENEST_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  keycloak:
    # Keycloak Admin REST API (cấp/khóa tài khoản) qua service account của client carenest-backend
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:carenest}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:carenest-backend}
    # Không có giá trị mặc định: thiếu secret thì API cấp tài khoản trả 503, các API khác vẫn chạy
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    # Bật khi đã cấu hình SMTP cho realm: gửi email đặt mật khẩu cho tài khoản mới có email
    actions-email-enabled: ${KEYCLOAK_ACTIONS_EMAIL_ENABLED:false}
    connect-timeout: 3s
    read-timeout: 5s
  ai:
    # AI-09: Gemini hoặc Groq qua endpoint OpenAI-compatible (Groq: https://api.groq.com/openai/v1).
    # Không có khóa ⇒ AI tắt, nghiệp vụ vẫn chạy (AI-03); lỗi/timeout ⇒ 503/504
    base-url: ${CARENEST_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${CARENEST_AI_API_KEY:}
    model: ${CARENEST_AI_MODEL:gemini-2.0-flash}
    connect-timeout: 3s
    read-timeout: ${CARENEST_AI_READ_TIMEOUT:20s}
  edu-plan:
    # EDU-10: khóa "Đang sửa" kế hoạch năm tự nhả sau khoảng này kể từ lần lưu cuối
    edit-lock-ttl: ${CARENEST_EDU_EDIT_LOCK_TTL:90s}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    # RestClient ở DEBUG in cả body (client_secret, mật khẩu tạm): giữ INFO kể cả khi bật DEBUG cho org.springframework.web
    org.springframework.web.client: INFO
