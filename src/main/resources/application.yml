spring:
  application:
    name: carenest-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carenest}
    username: ${DB_USERNAME:carenest}
    password: ${DB_PASSWORD:carenest}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

carenest:
  api:
    # Prefix gắn cho mọi controller trong com.carenest.controller (xem WebMvcConfig)
    prefix: ${API_PREFIX:/api}

management:
  endpoints:
    web:
      exposure:
        include: health
