services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carenest}
      POSTGRES_USER: ${POSTGRES_USER:-carenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carenest}
      # Dùng bởi docker/postgres/init khi tạo DB keycloak lần đầu
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required, copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # start-dev chỉ dùng cho dev/demo; server thật dùng "start" + HTTPS (docs/system/KEYCLOAK.md)
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required, copy .env.example to .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Cố định issuer cho mọi client (trình duyệt, curl, API trong container) để API kiểm iss khớp
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Placeholder trong docker/keycloak/import/carenest-realm.json
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required, copy .env.example to .env}
      CARENEST_WEB_ORIGIN: ${CARENEST_WEB_ORIGIN:-http://localhost:3000}
      CARENEST_MOBILE_REDIRECT_URI: ${CARENEST_MOBILE_REDIRECT_URI:-carenest://oauth/callback}
      # Client carenest-dev (password grant) chỉ bật ở dev; realm import mặc định tắt
      CARENEST_DEV_CLIENT_ENABLED: ${CARENEST_DEV_CLIENT_ENABLED:-true}
      CARENEST_SMTP_HOST: ${CARENEST_SMTP_HOST:-mailpit}
      CARENEST_SMTP_PORT: ${CARENEST_SMTP_PORT:-1025}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # Mount từng file (không lồng mount con vào thư mục mount read-only — Docker không tạo được mountpoint)
      - ./docker/keycloak/import/carenest-realm.json:/opt/keycloak/data/import/carenest-realm.json:ro
      # User dev cố định id, khớp seed db/dev/R__dev_seed.sql; server thật không mount file này
      - ./docker/keycloak/dev/carenest-users-0.json:/opt/keycloak/data/import/carenest-users-0.json:ro

  mailpit:
    image: axllent/mailpit:v1.31.4
    # Hộp thư giả cho dev: Keycloak gửi SMTP tới mailpit:1025, xem email tại http://localhost:8025
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    image: carenest_be:latest
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carenest}
      DB_USERNAME: ${POSTGRES_USER:-carenest}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-carenest}
      API_PREFIX: ${API_PREFIX:-/api}
      CARENEST_EDUCATION_MEDIA_BUCKET: ${CARENEST_EDUCATION_MEDIA_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      CARENEST_EDUCATION_MEDIA_ENDPOINT: ${CARENEST_EDUCATION_MEDIA_ENDPOINT:-}
      CARENEST_EDUCATION_MEDIA_PATH_STYLE: ${CARENEST_EDUCATION_MEDIA_PATH_STYLE:-false}
      CARENEST_EDUCATION_MEDIA_PREFIX: ${CARENEST_EDUCATION_MEDIA_PREFIX:-education/learning-resources/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Profile dev nạp dữ liệu giả (db/dev); đặt rỗng để chạy không seed
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Không phụ thuộc keycloak lúc khởi động: JWKS được lấy lazy khi có request đầu tiên
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_HOSTNAME:-http://localhost:8180}/realms/carenest
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/carenest/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-carenest-api}
      CARENEST_CORS_ALLOWED_ORIGINS: ${CARENEST_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Cấp/khóa tài khoản qua Keycloak Admin API (service account carenest-backend)
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Compose có Mailpit làm SMTP nên bật gửi email đặt mật khẩu
      KEYCLOAK_ACTIONS_EMAIL_ENABLED: ${KEYCLOAK_ACTIONS_EMAIL_ENABLED:-true}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
