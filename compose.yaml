services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carenest}
      POSTGRES_USER: ${POSTGRES_USER:-carenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carenest}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carenest}
      DB_USERNAME: ${POSTGRES_USER:-carenest}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-carenest}
      API_PREFIX: ${API_PREFIX:-/api}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
