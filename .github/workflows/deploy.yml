name: Deploy VPS

# main = production, dev = môi trường dev (compose.dev.yaml): push = verify + deploy, PR vào main/dev = chỉ verify.
# Pattern xét theo thứ tự: bỏ tài liệu, nhưng giữ docs/api/openapi.yaml (OpenApiSnapshotTest đọc docs/api/openapi.yaml)
on:
  push:
    branches: [main, dev]
    paths:
      - '**'
      - '!docs/**'
      - '!specs/**'
      - '!**/*.md'
      - '!.ai/**'
      - '!.claude/**'
      - '!.agents/**'
      - '!.githooks/**'
      - 'docs/api/openapi.yaml'
  pull_request:
    branches: [main, dev]
    paths:
      - '**'
      - '!docs/**'
      - '!specs/**'
      - '!**/*.md'
      - '!.ai/**'
      - '!.claude/**'
      - '!.agents/**'
      - '!.githooks/**'
      - 'docs/api/openapi.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKERHUB_USER: thangnd04
  # Repo private duy nhất của tài khoản free: api và Keycloak phân biệt bằng tiền tố tag
  IMAGE: thangnd04/carenest-be
  # Chỉ main/dev được push image (sau verify) và deploy; PR hoặc chạy tay trên nhánh khác chỉ verify.
  # Image đẩy từ dev đã verify ⇒ release cùng nội dung vào main dùng lại tag, không verify/build lại
  IS_DEPLOY_BRANCH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}

jobs:
  # Tag image = hash nội dung đầu vào. Tag đã có trên Docker Hub ⇒ nội dung đó đã verify + build trên main/dev ⇒ bỏ qua;
  # tag không đổi ⇒ compose không recreate container (Keycloak không restart khi không đổi)
  plan:
    runs-on: ubuntu-latest
    outputs:
      api_tag: ${{ steps.tags.outputs.api_tag }}
      keycloak_tag: ${{ steps.tags.outputs.keycloak_tag }}
      api_needed: ${{ steps.exists.outputs.api_needed }}
      keycloak_needed: ${{ steps.exists.outputs.keycloak_needed }}
    steps:
      - uses: actions/checkout@v4

      # Danh sách = mọi file mà test/build của image đọc; test hoặc Dockerfile đọc thêm file mới thì bổ sung ở đây.
      # Bỏ *.md: tài liệu không vào image, và push chỉ sửa .md không kích hoạt workflow
      - name: Compute content tags
        id: tags
        run: |
          set -o pipefail
          tree_hash() {
            local entries
            entries=$(git ls-tree -r HEAD -- "$@" | grep -v '\.md$')
            [ -n "$entries" ] || { echo "no tracked files under: $*" >&2; return 1; }
            printf '%s\n' "$entries" | sha1sum | cut -c1-12
          }
          api=$(tree_hash src pom.xml .mvn mvnw Dockerfile docs/api/openapi.yaml)
          keycloak=$(tree_hash docker/keycloak compose.yaml compose.auth.yaml)
          echo "api_tag=api-$api" >> "$GITHUB_OUTPUT"
          echo "keycloak_tag=keycloak-$keycloak" >> "$GITHUB_OUTPUT"

      # PR không có secret (fork, Dependabot) ⇒ login fail ⇒ inspect fail ⇒ verify đầy đủ (an toàn)
      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check existing images
        id: exists
        env:
          API_TAG: ${{ steps.tags.outputs.api_tag }}
          KEYCLOAK_TAG: ${{ steps.tags.outputs.keycloak_tag }}
        run: |
          needed() { docker manifest inspect "$IMAGE:$1" > /dev/null 2>&1 && echo false || echo true; }
          echo "api_needed=$(needed "$API_TAG")" | tee -a "$GITHUB_OUTPUT"
          echo "keycloak_needed=$(needed "$KEYCLOAK_TAG")" | tee -a "$GITHUB_OUTPUT"

  api:
    needs: plan
    if: needs.plan.outputs.api_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      # Spotless ratchetFrom origin/main (pom.xml) cần ref origin/main; checkout mặc định chỉ lấy 1 commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Testcontainers dùng Docker có sẵn trên runner ubuntu
      - run: node scripts/verify.mjs
      - if: failure()
        run: tail -n 200 target/verify.log

      - if: env.IS_DEPLOY_BRANCH == 'true'
        uses: docker/setup-buildx-action@v3
      - if: env.IS_DEPLOY_BRANCH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push api image
        if: env.IS_DEPLOY_BRANCH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.plan.outputs.api_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  keycloak:
    needs: plan
    if: needs.plan.outputs.keycloak_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # verify sinh luôn jar mà Dockerfile Keycloak copy ⇒ không package lần hai
      - run: ./mvnw -B -f docker/keycloak/extensions/carenest-auth/pom.xml verify
      - run: node --test docker/keycloak/auth/*.test.mjs

      - if: env.IS_DEPLOY_BRANCH == 'true'
        uses: docker/setup-buildx-action@v3
      - if: env.IS_DEPLOY_BRANCH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Keycloak image
        if: env.IS_DEPLOY_BRANCH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/keycloak
          file: docker/keycloak/auth/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.plan.outputs.keycloak_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,scope=keycloak,mode=max

  # Job api/keycloak bị skip (tag đã có) vẫn deploy; job nào fail ⇒ không deploy, VPS giữ bản đang chạy
  deploy:
    needs: [plan, api, keycloak]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /data/thangnd/CAPSTONE/CareNest_BE
      CADDY_DIR: /data/thangnd/CAPSTONE/caddy
      AUTH_DISCOVERY_URL: https://auth.carenest.edu.vn/realms/carenest/.well-known/openid-configuration
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Realm gateway sinh từ bản import chuẩn (thư mục generated bị ignore), được mount vào Keycloak trên VPS
      - name: Prepare Keycloak realm
        run: node docker/keycloak/auth/prepare.mjs

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # Image lấy từ Docker Hub ⇒ VPS chỉ cần compose + file mount; .env trên VPS không bị đụng.
      # File vào .incoming/; deploy/remote-deploy.sh kiểm tra rồi mới đưa vào chỗ chạy (và giữ bản cũ để rollback)
      - name: Upload compose and mounted files
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR/.incoming'"
          rsync -azR -e "ssh -p $VPS_PORT" \
            deploy/remote-deploy.sh \
            deploy/vps.env.example \
            compose.vps.yaml \
            docker/postgres/init/ \
            docker/keycloak/auth/generated/carenest-realm.json \
            docker/keycloak/vps/carenest-users-0.json \
            "$VPS_USER@$VPS_HOST:$APP_DIR/.incoming/"

      # Đuôi .new không khớp `import *.caddy` nên Caddy chưa đọc tới khi bước Apply đổi tên
      - name: Upload Caddy site
        run: |
          rsync -z -e "ssh -p $VPS_PORT" deploy/caddy/carenest-auth.caddy \
            "$VPS_USER@$VPS_HOST:$CADDY_DIR/carenest-auth.caddy.new"

      # Toàn bộ logic (kiểm trước, backup DB, up, chờ health, tự rollback) nằm trong deploy/remote-deploy.sh.
      # Keycloak tự build lại + import realm lần đầu, API chạy Flyway ⇒ chờ health tối đa ~3 phút
      - name: Pull and restart on VPS
        env:
          API_IMAGE: ${{ env.IMAGE }}:${{ needs.plan.outputs.api_tag }}
          KEYCLOAK_IMAGE: ${{ env.IMAGE }}:${{ needs.plan.outputs.keycloak_tag }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && \
            DEPLOY_ENV=production COMPOSE_FILE=compose.vps.yaml ENV_EXAMPLE=deploy/vps.env.example \
            MANAGED_PATHS='compose.vps.yaml docker/postgres/init docker/keycloak/auth/generated/carenest-realm.json docker/keycloak/vps/carenest-users-0.json' \
            API_HEALTH_URL=http://127.0.0.1:18310/actuator/health KC_HEALTH_URL=http://127.0.0.1:18321/health/ready \
            API_IMAGE='$API_IMAGE' KEYCLOAK_IMAGE='$KEYCLOAK_IMAGE' \
            bash .incoming/deploy/remote-deploy.sh"

      # Caddy dùng chung với site khác: reload lỗi thì Caddy giữ cấu hình đang chạy,
      # nhưng file lỗi còn trên đĩa sẽ làm Caddy không lên sau reboot ⇒ khôi phục file cũ
      - name: Apply Caddy site
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$CADDY_DIR' && bash -s" <<'EOF'
          set -e
          rm -f carenest-auth.caddy.bak
          if cmp -s carenest-auth.caddy.new carenest-auth.caddy; then
            rm carenest-auth.caddy.new
            echo "Caddy site unchanged"
            exit 0
          fi
          if [ -f carenest-auth.caddy ]; then cp -p carenest-auth.caddy carenest-auth.caddy.bak; fi
          mv carenest-auth.caddy.new carenest-auth.caddy
          if ! sudo -n systemctl reload caddy; then
            if [ -f carenest-auth.caddy.bak ]; then mv carenest-auth.caddy.bak carenest-auth.caddy; else rm carenest-auth.caddy; fi
            sudo -n systemctl reload caddy || true
            echo "Caddy reload failed, previous site file restored" >&2
            exit 1
          fi
          EOF

      # Token Keycloak phải có iss https (KEYCLOAK_ISSUER_URI của API so khớp tuyệt đối)
      - name: Smoke test HTTPS
        id: smoke
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$AUTH_DISCOVERY_URL" \
            | grep -F '"issuer":"https://auth.carenest.edu.vn/realms/carenest"'

      # Smoke fail sau khi bản mới đã lên ⇒ quay về bản trước (cùng logic với health fail)
      - name: Roll back after failed smoke test
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && \
            DEPLOY_ENV=production COMPOSE_FILE=compose.vps.yaml ENV_EXAMPLE=deploy/vps.env.example \
            MANAGED_PATHS=compose.vps.yaml \
            API_HEALTH_URL=http://127.0.0.1:18310/actuator/health KC_HEALTH_URL=http://127.0.0.1:18321/health/ready \
            bash .incoming/deploy/remote-deploy.sh rollback 'smoke test failed'"

  # Môi trường dev (compose.dev.yaml): Keycloak + api riêng, dùng chung Postgres/Mailpit của production.
  # .env dev và DB/role carenest_dev, keycloak_dev tạo tay một lần (docs/system/DEPLOYMENT.md mục Môi trường dev)
  deploy-dev:
    needs: [plan, api, keycloak]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_DIR: /data/thangnd/CAPSTONE/CareNest_BE-dev
      CADDY_DIR: /data/thangnd/CAPSTONE/caddy
      SITE_FILE: carenest-auth-dev.caddy
      AUTH_DISCOVERY_URL: https://auth-dev.carenest.edu.vn/realms/carenest/.well-known/openid-configuration
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Keycloak realm
        run: node docker/keycloak/auth/prepare.mjs

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose and mounted files
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR/.incoming'"
          rsync -azR -e "ssh -p $VPS_PORT" \
            deploy/remote-deploy.sh \
            deploy/dev.env.example \
            compose.dev.yaml \
            docker/keycloak/auth/generated/carenest-realm.json \
            docker/keycloak/vps/carenest-users-0.json \
            "$VPS_USER@$VPS_HOST:$APP_DIR/.incoming/"

      - name: Upload Caddy site
        run: |
          rsync -z -e "ssh -p $VPS_PORT" "deploy/caddy/$SITE_FILE" \
            "$VPS_USER@$VPS_HOST:$CADDY_DIR/$SITE_FILE.new"

      # Postgres thuộc stack production: không chạy thì script dừng và báo rõ. DB dev (carenest_dev, keycloak_dev)
      # là DB duy nhất script được phép khôi phục trong job này; DB production không bị chạm
      - name: Pull and restart on VPS
        env:
          API_IMAGE: ${{ env.IMAGE }}:${{ needs.plan.outputs.api_tag }}
          KEYCLOAK_IMAGE: ${{ env.IMAGE }}:${{ needs.plan.outputs.keycloak_tag }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && \
            DEPLOY_ENV=dev COMPOSE_FILE=compose.dev.yaml ENV_EXAMPLE=deploy/dev.env.example \
            MANAGED_PATHS='compose.dev.yaml docker/keycloak/auth/generated/carenest-realm.json docker/keycloak/vps/carenest-users-0.json' \
            API_HEALTH_URL=http://127.0.0.1:18311/actuator/health KC_HEALTH_URL=http://127.0.0.1:18323/health/ready \
            API_IMAGE='$API_IMAGE' KEYCLOAK_IMAGE='$KEYCLOAK_IMAGE' \
            bash .incoming/deploy/remote-deploy.sh"

      # Giống production: reload lỗi ⇒ khôi phục file cũ để Caddy vẫn lên sau reboot
      - name: Apply Caddy site
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$CADDY_DIR' && SITE_FILE='$SITE_FILE' bash -s" <<'EOF'
          set -e
          rm -f "$SITE_FILE.bak"
          if cmp -s "$SITE_FILE.new" "$SITE_FILE"; then
            rm "$SITE_FILE.new"
            echo "Caddy site unchanged"
            exit 0
          fi
          if [ -f "$SITE_FILE" ]; then cp -p "$SITE_FILE" "$SITE_FILE.bak"; fi
          mv "$SITE_FILE.new" "$SITE_FILE"
          if ! sudo -n systemctl reload caddy; then
            if [ -f "$SITE_FILE.bak" ]; then mv "$SITE_FILE.bak" "$SITE_FILE"; else rm "$SITE_FILE"; fi
            sudo -n systemctl reload caddy || true
            echo "Caddy reload failed, previous site file restored" >&2
            exit 1
          fi
          EOF

      # Lần đầu Caddy cần thời gian xin chứng chỉ cho auth-dev
      - name: Smoke test HTTPS
        id: smoke
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$AUTH_DISCOVERY_URL" \
            | grep -F '"issuer":"https://auth-dev.carenest.edu.vn/realms/carenest"'

      - name: Roll back after failed smoke test
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && \
            DEPLOY_ENV=dev COMPOSE_FILE=compose.dev.yaml ENV_EXAMPLE=deploy/dev.env.example \
            MANAGED_PATHS=compose.dev.yaml \
            API_HEALTH_URL=http://127.0.0.1:18311/actuator/health KC_HEALTH_URL=http://127.0.0.1:18323/health/ready \
            bash .incoming/deploy/remote-deploy.sh rollback 'smoke test failed'"
