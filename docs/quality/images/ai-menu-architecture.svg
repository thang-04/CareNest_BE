<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" width="1400" height="1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1400" height="1080" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Kiến trúc AI gợi ý thực đơn bán trú — CareNest</text>

  <!-- A: dữ liệu nạp -->
  <rect x="60" y="64" width="1280" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="92" font-size="18" font-weight="700" fill="#1d4ed8">Dữ liệu nạp — PostgreSQL, do trường nhập (AI không tạo dữ liệu dinh dưỡng nền, NUT-05)</text>
  <text x="80" y="120" font-size="15" fill="#1f2937">Danh mục món + định lượng gam/trẻ theo nhóm tuổi · thực phẩm + giá trị /100 g có nguồn (Viện Dinh dưỡng) · định mức nhóm tuổi (PHT nhập)</text>
  <text x="80" y="146" font-size="15" fill="#1f2937">Kế hoạch tuần 4 tuần liền trước (truy vấn SQL theo ngày) · bộ mẫu theo mùa · tồn kho khô theo lô · thực phẩm thiếu / món bắt buộc PHT nhập</text>

  <line x1="410" y1="164" x2="410" y2="204" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- B1: lọc cứng -->
  <rect x="60" y="206" width="700" height="116" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="80" y="234" font-size="18" font-weight="700" fill="#047857">[1] Lọc cứng bằng SQL + code (tất định)</text>
  <text x="80" y="260" font-size="15" fill="#1f2937">Đúng loại món của ô · món đang dùng · đủ định lượng · bỏ món chứa thực phẩm thiếu</text>
  <text x="80" y="284" font-size="15" fill="#1f2937">Xếp ưu tiên: chưa dùng gần đây, kho còn, giống mong muốn (vector), hợp mùa, món quen</text>
  <text x="80" y="308" font-size="13" fill="#6b7280">MenuAiContextLoader · MenuCandidateBuilder</text>

  <!-- vector (chưa làm) -->
  <rect x="820" y="206" width="520" height="116" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="840" y="234" font-size="18" font-weight="700" fill="#b45309">[1b] pgvector — dish_embeddings</text>
  <text x="840" y="260" font-size="15" fill="#1f2937">Điểm cosine món ↔ "mong muốn" của PHT / món cần thay</text>
  <text x="840" y="284" font-size="15" fill="#1f2937">Chỉ đổi thứ tự ưu tiên món trong ô, luôn SAU lọc cứng</text>
  <text x="840" y="308" font-size="13" fill="#6b7280">DishSimilarity · embed lười theo lô · lịch sử thực đơn KHÔNG embed</text>
  <line x1="820" y1="264" x2="764" y2="264" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrO)"/>

  <line x1="410" y1="322" x2="410" y2="362" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- pill: ứng viên -->
  <rect x="300" y="364" width="800" height="48" rx="24" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="700" y="394" text-anchor="middle" font-size="15" fill="#111827">Ứng viên mỗi ô, bí danh D1..Dn — không id thật, không dữ liệu trẻ (AI-04)</text>

  <path d="M520,412 L370,462" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M880,412 L1030,462" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 2a -->
  <rect x="100" y="464" width="540" height="104" rx="12" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="120" y="492" font-size="18" font-weight="700" fill="#111827">[2a] Phương án theo quy tắc (baseline, không AI)</text>
  <text x="120" y="518" font-size="15" fill="#1f2937">Luôn có, chạy được khi AI tắt / hết hạn mức / timeout</text>
  <text x="120" y="542" font-size="13" fill="#6b7280">RuleBasedMenuPlanner</text>

  <!-- 2b -->
  <rect x="760" y="464" width="540" height="104" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="492" font-size="18" font-weight="700" fill="#6d28d9">[2b] LLM — Gemini Flash → Groq (AiGateway)</text>
  <text x="780" y="518" font-size="15" fill="#1f2937">Chỉ CHỌN bí danh cho từng ô; output lạ / sai ô / JSON hỏng ⇒ loại</text>
  <text x="780" y="542" font-size="13" fill="#6b7280">MenuAiOutputParser · deadline ~30s</text>

  <line x1="370" y1="568" x2="370" y2="618" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1030" y1="568" x2="1030" y2="618" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 3 -->
  <rect x="60" y="620" width="1280" height="108" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="648" font-size="18" font-weight="700" fill="#b91c1c">[3] Code tính dinh dưỡng — LLM không tính số (NUT-05, NUT-06)</text>
  <text x="80" y="674" font-size="15" fill="#1f2937">Σ gam × giá trị/100 g ⇒ kcal, đạm–béo ĐV/TV, bột đường, vi chất, giá; so với định mức bằng MealPlanEvaluator (cùng bộ kiểm chặn công bố, NUT-08)</text>
  <text x="80" y="698" font-size="15" fill="#1f2937">Sửa tất định (MenuPlanRepairer) ⇒ chấm điểm cả hai phương án bằng cùng công thức (MenuScore)</text>
  <text x="80" y="718" font-size="13" fill="#6b7280">Lý do model viết bị xóa chữ số; hiển thị số do code tính</text>

  <line x1="700" y1="728" x2="700" y2="766" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- gate -->
  <rect x="200" y="768" width="1000" height="66" rx="33" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="700" y="798" text-anchor="middle" font-size="18" font-weight="700" fill="#c2410c">Cổng giá trị</text>
  <text x="700" y="820" text-anchor="middle" font-size="15" fill="#1f2937">AI hợp lệ: qua guard cấu trúc + không còn lỗi BLOCKING + điểm ≥ phương án quy tắc?</text>

  <path d="M420,834 L330,876" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M980,834 L1070,876" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="340" y="858" text-anchor="end" font-size="14" font-weight="700" fill="#047857">Đạt</text>
  <text x="1060" y="858" font-size="14" font-weight="700" fill="#4b5563">Không đạt</text>

  <rect x="100" y="878" width="460" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="330" y="906" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">source = AI</text>
  <text x="330" y="928" text-anchor="middle" font-size="14" fill="#1f2937">Dùng phương án của model</text>

  <rect x="840" y="878" width="460" height="64" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="1070" y="906" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">source = RULE_BASED</text>
  <text x="1070" y="928" text-anchor="middle" font-size="14" fill="#1f2937">fallbackReason: AI_INVALID / AI_NOT_BETTER / AI_DISABLED</text>

  <path d="M330,942 L600,988" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M1070,942 L800,988" stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 4 -->
  <rect x="200" y="990" width="1000" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="700" y="1014" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">[4] Nháp menu_ai_drafts ⇒ PHT sửa / dùng / bỏ ⇒ công bố như cũ</text>
  <text x="700" y="1036" text-anchor="middle" font-size="14" fill="#1f2937">AI chỉ hỗ trợ — không tự công bố (AI-02); không lưu prompt/response thô (AI-05)</text>

  <text x="700" y="1070" text-anchor="middle" font-size="13" fill="#6b7280">Truy xuất lai: SQL lọc cứng (bắt buộc) + vector chỉ xếp lại thứ tự. Embedding tắt/lỗi/hết giờ ⇒ thứ tự như cũ, nháp vẫn trả.</text>
</svg>
