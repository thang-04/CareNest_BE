openapi: 3.1.0
info:
  description: REST API dùng chung cho CareNest web và mobile
  title: CareNest API
  version: v1
servers:
- description: Generated server url
  url: http://localhost
security:
- bearerAuth: []
paths:
  /api/accounts:
    get:
      operationId: searchAccounts
      parameters:
      - in: query
        name: role
        required: false
        schema:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - in: query
        name: campusId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonPageResponseAccountSummaryResponse"
          description: OK
      tags:
      - account-controller
    post:
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCreateAccountResponse"
          description: Created
      tags:
      - account-controller
  /api/accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonMyAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/accounts/{userId}:
    get:
      operationId: getAccountDetail
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccountDetailResponse"
          description: OK
      tags:
      - account-controller
  /api/accounts/{userId}/permission-overrides:
    get:
      operationId: getPermissionOverrides
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonUserPermissionOverridesResponse"
          description: OK
      tags:
      - permission-controller
    put:
      operationId: updatePermissionOverrides
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionOverridesRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonUserPermissionOverridesResponse"
          description: OK
      tags:
      - permission-controller
  /api/accounts/{userId}/status:
    patch:
      operationId: updateAccountStatus
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/accounts/{userId}/temporary-password:
    post:
      operationId: resetTemporaryPassword
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetTemporaryPasswordRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/auth/csrf:
    get:
      operationId: csrf
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCsrf"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Login successful
        "428":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Verified temporary password requires first-login setup
      security: []
      tags:
      - auth-controller
  /api/auth/logout:
    post:
      operationId: logout
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/forgot:
    post:
      operationId: forgot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Forgot"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}:
    get:
      operationId: otpMetadata
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/resend:
    post:
      operationId: resend
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/verify:
    post:
      operationId: verifyOtp
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonResetToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/reset:
    post:
      operationId: setPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reset"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/refresh:
    post:
      operationId: refresh
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccessToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/campuses:
    get:
      operationId: listCampuses
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListCampusResponse"
          description: OK
      tags:
      - school-structure-controller
  /api/children:
    get:
      operationId: searchChildren
      parameters:
      - in: query
        name: campusId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: classroomId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonPageResponseChildSummaryResponse"
          description: OK
      tags:
      - child-controller
  /api/children/{childId}:
    get:
      operationId: getChildProfile
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonChildProfileResponse"
          description: OK
      tags:
      - child-controller
  /api/children/{childId}/guardians:
    get:
      operationId: listGuardians
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListGuardianResponse"
          description: OK
      tags:
      - guardian-controller
    post:
      operationId: addGuardian
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGuardianRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAddGuardianResponse"
          description: Created
      tags:
      - guardian-controller
  /api/children/{childId}/guardians/{userId}:
    delete:
      operationId: removeGuardian
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      tags:
      - guardian-controller
  /api/classrooms:
    get:
      operationId: listClassrooms
      parameters:
      - in: query
        name: campusId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListClassroomResponse"
          description: OK
      tags:
      - school-structure-controller
  /api/me/password:
    put:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      tags:
      - password-controller
  /api/parent-accounts/{userId}/status:
    patch:
      operationId: updateParentStatus
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccountResponse"
          description: OK
      tags:
      - guardian-controller
  /api/parent-accounts/{userId}/temporary-password:
    post:
      operationId: resetParentPassword
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonParentPasswordResponse"
          description: OK
      tags:
      - guardian-controller
  /api/permission-change-logs:
    get:
      operationId: getPermissionChangeLogs
      parameters:
      - in: query
        name: targetRole
        required: false
        schema:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
      - in: query
        name: targetUserId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonPageResponsePermissionChangeLogResponse"
          description: OK
      tags:
      - permission-controller
  /api/permissions:
    get:
      operationId: getPermissionCatalog
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListPermissionResponse"
          description: OK
      tags:
      - permission-controller
  /api/role-permissions:
    get:
      operationId: getRolePermissions
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListRolePermissionResponse"
          description: OK
      tags:
      - permission-controller
  /api/role-permissions/{role}:
    get:
      operationId: getRolePermission
      parameters:
      - in: path
        name: role
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonRolePermissionResponse"
          description: OK
      tags:
      - permission-controller
    put:
      operationId: updateRolePermissions
      parameters:
      - in: path
        name: role
        required: true
        schema:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolePermissionsRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonRolePermissionResponse"
          description: OK
      tags:
      - permission-controller
  /api/staff-assignments:
    post:
      operationId: assignStaff
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffAssignmentRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonStaffAssignmentResponse"
          description: Created
      tags:
      - staff-assignment-controller
  /api/staff-assignments/{assignmentId}/end:
    patch:
      operationId: endAssignment
      parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndStaffAssignmentRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonStaffAssignmentResponse"
          description: OK
      tags:
      - staff-assignment-controller
components:
  schemas:
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    AccountDetailResponse:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/StaffAssignmentResponse"
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    AccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    AccountSummaryResponse:
      type: object
      properties:
        activeAssignments:
          type: array
          items:
            $ref: "#/components/schemas/StaffAssignmentSummaryResponse"
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    AddGuardianRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        fullName:
          type: string
          maxLength: 150
          minLength: 0
        phone:
          type: string
          maxLength: 20
          minLength: 0
        relationship:
          type: string
          enum:
          - MOTHER
          - FATHER
          - GUARDIAN
          - OTHER
      required:
      - fullName
      - phone
      - relationship
    AddGuardianResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        newAccount:
          type: boolean
        relationship:
          type: string
          enum:
          - MOTHER
          - FATHER
          - GUARDIAN
          - OTHER
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        temporaryPassword:
          type: string
        userId:
          type: integer
          format: int64
        username:
          type: string
    CampusResponse:
      type: object
      properties:
        code:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
    ChangePassword:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
      required:
      - confirmPassword
      - currentPassword
      - newPassword
    ChildProfileResponse:
      type: object
      properties:
        classroomId:
          type: integer
          format: int64
        dateOfBirth:
          type: string
          format: date
        fullName:
          type: string
        id:
          type: integer
          format: int64
    ChildSummaryResponse:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
        classroomId:
          type: integer
          format: int64
        dateOfBirth:
          type: string
          format: date
        fullName:
          type: string
        guardianCount:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
    ClassroomResponse:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        name:
          type: string
    CreateAccountRequest:
      type: object
      properties:
        assignment:
          $ref: "#/components/schemas/StaffAssignmentScopeRequest"
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        fullName:
          type: string
          maxLength: 150
          minLength: 0
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        temporaryPassword:
          type: string
          maxLength: 128
          minLength: 8
        username:
          type: string
          maxLength: 100
          minLength: 3
          pattern: "^[A-Za-z0-9._-]+$"
      required:
      - fullName
      - role
      - username
    CreateAccountResponse:
      type: object
      properties:
        assignment:
          $ref: "#/components/schemas/StaffAssignmentResponse"
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        setupEmailSent:
          type: boolean
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    CreateStaffAssignmentRequest:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
        classroomId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
      required:
      - userId
    Csrf:
      type: object
      properties:
        headerName:
          type: string
        token:
          type: string
    EndStaffAssignmentRequest:
      type: object
      properties:
        validTo:
          type: string
          format: date
      required:
      - validTo
    Forgot:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
      required:
      - email
    GuardianResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        linkedAt:
          type: string
          format: date-time
        relationship:
          type: string
          enum:
          - MOTHER
          - FATHER
          - GUARDIAN
          - OTHER
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    Login:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 1
        remember:
          type: boolean
      required:
      - identifier
      - password
    LoginData:
      type: object
      properties:
        accessToken:
          type: string
        account:
          $ref: "#/components/schemas/MyAccountResponse"
        changeToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        passwordChangeRequired:
          type: boolean
    MyAccountResponse:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/StaffAssignmentSummaryResponse"
        childIds:
          type: array
          items:
            type: integer
            format: int64
        email:
