openapi: 3.1.0
info:
  description: REST API dùng chung cho CareNest web và mobile
  title: CareNest API
  version: v1
servers:
- description: Generated server url
  url: http://localhost
security:
- bearerAuth: []
paths:
  /api/accounts:
    post:
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCreateAccountResponse"
          description: Created
      tags:
      - account-controller
  /api/accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonMyAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/accounts/{userId}/status:
    patch:
      operationId: updateAccountStatus
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/auth/csrf:
    get:
      operationId: csrf
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCsrf"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Login successful
        "428":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Verified temporary password requires first-login setup
      security: []
      tags:
      - auth-controller
  /api/auth/logout:
    post:
      operationId: logout
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/forgot:
    post:
      operationId: forgot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Forgot"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}:
    get:
      operationId: otpMetadata
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/resend:
    post:
      operationId: resend
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/verify:
    post:
      operationId: verifyOtp
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonResetToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/reset:
    post:
      operationId: setPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reset"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/refresh:
    post:
      operationId: refresh
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccessToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/children/{childId}:
    get:
      operationId: getChildProfile
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonChildProfileResponse"
          description: OK
      tags:
      - child-controller
  /api/education-plans/config:
    get:
      operationId: getEduConfig
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonEduConfigResponse"
          description: OK
      tags:
      - edu-config-controller
  /api/education-plans/expected-results:
    get:
      operationId: getExpectedResults
      parameters:
      - in: query
        name: ageGroupId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListExpectedResultResponse"
          description: OK
      tags:
      - edu-config-controller
  /api/education-plans/goals:
    get:
      operationId: getYearPlans
      parameters:
      - in: query
        name: schoolYearId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: ageGroupId
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonPageResponseYearPlanSummaryResponse"
          description: OK
      tags:
      - edu-year-plan-controller
    post:
      operationId: createYearPlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YearPlanRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonYearPlanDetailResponse"
          description: Created
      tags:
      - edu-year-plan-controller
  /api/education-plans/goals/{planId}:
    delete:
      operationId: deleteYearPlan
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      tags:
      - edu-year-plan-controller
    get:
      operationId: getYearPlan
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonYearPlanDetailResponse"
          description: OK
      tags:
      - edu-year-plan-controller
    put:
      operationId: updateYearPlan
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YearPlanRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonYearPlanDetailResponse"
          description: OK
      tags:
      - edu-year-plan-controller
  /api/education-plans/goals/{planId}/issue:
    post:
      operationId: issueYearPlan
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Note"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonYearPlanDetailResponse"
          description: OK
      tags:
      - edu-year-plan-controller
  /api/education-plans/goals/{planId}/return:
    post:
      operationId: returnYearPlan
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequiredNote"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonYearPlanDetailResponse"
          description: OK
      tags:
      - edu-year-plan-controller
  /api/education-plans/goals/{planId}/submit:
    post:
      operationId: submitYearPlan
      parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Note"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonYearPlanDetailResponse"
          description: OK
      tags:
      - edu-year-plan-controller
  /api/me/password:
    put:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      tags:
      - password-controller
components:
  schemas:
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    AccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    AgeGroupResponse:
      type: object
      properties:
        code:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        shortName:
          type: string
        sortOrder:
          type: integer
          format: int32
    Break:
      type: object
      properties:
        endDate:
          type: string
          format: date
        id:
          type: integer
          format: int64
        label:
          type: string
          maxLength: 150
          minLength: 0
        startDate:
          type: string
          format: date
    ChangePassword:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
      required:
      - confirmPassword
      - currentPassword
      - newPassword
    ChildProfileResponse:
      type: object
      properties:
        classroomId:
          type: integer
          format: int64
        dateOfBirth:
          type: string
          format: date
        fullName:
          type: string
        id:
          type: integer
          format: int64
    Content:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        themeKeys:
          type: array
          items:
            type: string
    CreateAccountRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        fullName:
          type: string
          maxLength: 150
          minLength: 0
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        temporaryPassword:
          type: string
          maxLength: 128
          minLength: 8
        username:
          type: string
          maxLength: 100
          minLength: 3
          pattern: "^[A-Za-z0-9._-]+$"
      required:
      - fullName
      - role
      - username
    CreateAccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        setupEmailSent:
          type: boolean
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    Csrf:
      type: object
      properties:
        headerName:
          type: string
        token:
          type: string
    Domain:
      type: object
      properties:
        domainId:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: "#/components/schemas/Row"
      required:
      - domainId
    EduConfigResponse:
      type: object
      properties:
        ageGroups:
          type: array
          items:
            $ref: "#/components/schemas/AgeGroupResponse"
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        schoolYears:
          type: array
          items:
            $ref: "#/components/schemas/SchoolYearResponse"
    ExpectedResultResponse:
      type: object
      properties:
        domainId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        subDomain:
          type: string
        text:
          type: string
    Forgot:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
      required:
      - email
    History:
      type: object
      properties:
        action:
          type: string
        actorName:
          type: string
        actorRoleLabel:
          type: string
        at:
          type: string
          format: date-time
        label:
          type: string
        note:
          type: string
        tone:
          type: string
    Login:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 1
        remember:
          type: boolean
      required:
      - identifier
      - password
    LoginData:
      type: object
      properties:
        accessToken:
          type: string
        account:
          $ref: "#/components/schemas/MyAccountResponse"
        changeToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        passwordChangeRequired:
          type: boolean
    MyAccountResponse:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/StaffAssignmentSummaryResponse"
        childIds:
          type: array
          items:
            type: integer
            format: int64
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - PRINCIPAL
            - VICE_PRINCIPAL
            - TEACHER
            - KITCHEN_STAFF
            - PARENT
        userId:
          type: integer
          format: int64
        username:
          type: string
    Note:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          minLength: 0
    OtpRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        requestId:
          type: string
        resendAvailableAt:
          type: string
          format: date-time
    PageResponseYearPlanSummaryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/YearPlanSummaryResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Permissions:
      type: object
      properties:
        canDelete:
          type: boolean
        canEdit:
          type: boolean
        canIssue:
          type: boolean
        canReturn:
          type: boolean
        canSubmit:
          type: boolean
    PlanActorResponse:
      type: object
      properties:
        at:
          type: string
          format: date-time
        name:
          type: string
        title:
          type: string
        userId:
          type: integer
          format: int64
    Refresh:
      type: object
      properties:
        force:
          type: boolean
    RequiredNote:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - note
    Reset:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
        token:
          type: string
          pattern: "[A-Za-z0-9_-]{43}"
      required:
      - confirmPassword
      - newPassword
      - token
    ResetToken:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        resetToken:
          type: string
    ResponseJsonAccessToken:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/AccessToken"
        desc:
          type: string
    ResponseJsonAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/AccountResponse"
        desc:
          type: string
    ResponseJsonChildProfileResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/ChildProfileResponse"
        desc:
          type: string
    ResponseJsonCreateAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/CreateAccountResponse"
        desc:
          type: string
    ResponseJsonCsrf:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/Csrf"
        desc:
          type: string
    ResponseJsonEduConfigResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/EduConfigResponse"
        desc:
          type: string
    ResponseJsonListExpectedResultResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExpectedResultResponse"
        desc:
          type: string
    ResponseJsonLoginData:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/LoginData"
        desc:
          type: string
    ResponseJsonMyAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/MyAccountResponse"
        desc:
          type: string
    ResponseJsonOtpRequest:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/OtpRequest"
        desc:
          type: string
    ResponseJsonPageResponseYearPlanSummaryResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/PageResponseYearPlanSummaryResponse"
        desc:
          type: string
    ResponseJsonResetToken:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/ResetToken"
        desc:
          type: string
    ResponseJsonVoid:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data: {}
        desc:
          type: string
    ResponseJsonYearPlanDetailResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/YearPlanDetailResponse"
        desc:
          type: string
    Row:
      type: object
      properties:
        contents:
          type: array
          items:
            $ref: "#/components/schemas/Content"
        id:
          type: integer
          format: int64
        kind:
          type: string
          minLength: 1
          pattern: sub|group|goal
        text:
          type: string
      required:
      - kind
    SchoolYearResponse:
      type: object
      properties:
        endDate:
          type: string
          format: date
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date
    StaffAssignmentSummaryResponse:
      type: object
      properties:
        ageGroupId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
        classroomId:
          type: integer
          format: int64
        staffRole:
          type: string
          enum:
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - AGE_GROUP_TEAM_LEADER
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    Theme:
      type: object
      properties:
        abbr:
          type: string
          maxLength: 20
          minLength: 0
        endDate:
          type: string
          format: date
        festivals:
          type: string
        id:
          type: integer
          format: int64
        key:
          type: string
          maxLength: 60
          minLength: 0
        name:
          type: string
          maxLength: 150
          minLength: 0
        note:
          type: string
        startDate:
          type: string
          format: date
      required:
      - key
    UpdateAccountStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      required:
      - status
    VerifyOtp:
      type: object
      properties:
        otp:
          type: string
          pattern: "[0-9]{6}"
      required:
      - otp
    YearPlanDetailResponse:
      type: object
      properties:
        ageGroupId:
          type: integer
          format: int64
        ageGroupName:
          type: string
        breaks:
          type: array
          items:
            $ref: "#/components/schemas/Break"
        code:
          type: string
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        history:
          type: array
          items:
            $ref: "#/components/schemas/History"
        id:
          type: integer
          format: int64
        issued:
          $ref: "#/components/schemas/PlanActorResponse"
        lastReturnNote:
          type: string
        owner:
