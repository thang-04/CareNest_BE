components:
  schemas:
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    AccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    ActivateSchoolYearRequest:
      type: object
      properties:
        confirmName:
          type: string
          minLength: 1
      required:
      - confirmName
    Adjustment:
      type: object
      properties:
        action:
          type: string
        at:
          type: string
          format: date-time
        classId:
          type: integer
          format: int64
        normal:
          type: integer
          format: int32
        note:
          type: string
        substitute:
          type: integer
          format: int32
        userId:
          type: integer
          format: int64
        userName:
          type: string
    AgeGroupBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shortName:
          type: string
    AgeGroupDetailResponse:
      type: object
      properties:
        ageFromMonths:
          type: integer
          format: int32
        ageToMonths:
          type: integer
          format: int32
        code:
          type: string
        id:
          type: integer
          format: int64
        maxClassSize:
          type: integer
          format: int32
        mealSessions:
          type: array
          items:
            type: string
            enum:
            - MORNING
            - LUNCH
            - AFTERNOON
        mealsPerDay:
          type: integer
          format: int32
        name:
          type: string
        nutritionNote:
          type: string
        shortName:
          type: string
        sortOrder:
          type: integer
          format: int32
    AgeGroupRequest:
      type: object
      properties:
        ageFromMonths:
          type: integer
          format: int32
          maximum: 72
          minimum: 0
        ageToMonths:
          type: integer
          format: int32
          maximum: 72
          minimum: 1
        maxClassSize:
          type: integer
          format: int32
          maximum: 32767
          minimum: 1
        mealSessions:
          type: array
          items:
            type: string
            enum:
            - MORNING
            - LUNCH
            - AFTERNOON
          minItems: 1
        name:
          type: string
          maxLength: 50
          minLength: 0
        nutritionNote:
          type: string
          maxLength: 500
          minLength: 0
        shortName:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - ageFromMonths
      - ageToMonths
      - maxClassSize
      - mealSessions
      - name
      - shortName
    AgeGroupResponse:
      type: object
      properties:
        code:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        shortName:
          type: string
        sortOrder:
          type: integer
          format: int32
    AssignmentHistoryResponse:
      type: object
      properties:
        assignedAt:
          type: string
          format: date-time
        assignedBy:
          type: integer
          format: int64
        assignedByName:
          type: string
        current:
          type: boolean
        fullName:
          type: string
        homeroom:
          type: boolean
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    AttendanceClassResponse:
      type: object
      properties:
        ageGroupId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
        canRecord:
          type: boolean
        canUnlock:
          type: boolean
        id:
          type: integer
          format: int64
        mealSessions:
          type: array
          items:
            type: string
            enum:
            - MORNING
            - LUNCH
            - AFTERNOON
        name:
          type: string
        teaches:
          type: boolean
    Attention:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
        childId:
          type: integer
          format: int64
        childName:
          type: string
        classId:
          type: integer
          format: int64
        className:
          type: string
        latest:
          $ref: "#/components/schemas/DailyHealthEntryResponse"
        readings:
          type: array
          items:
            $ref: "#/components/schemas/DailyHealthEntryResponse"
    AutoPlaceRequest:
      type: object
      properties:
        ageGroupId:
          type: integer
          format: int64
        campusId:
          type: integer
          format: int64
    AutoPlaceResponse:
      type: object
      properties:
        graduated:
          type: integer
          format: int32
        promoted:
          type: integer
          format: int32
        unplaced:
          type: array
          items:
            $ref: "#/components/schemas/Unplaced"
    Break:
      type: object
      properties:
        endDate:
          type: string
          format: date
        id:
          type: integer
          format: int64
        label:
          type: string
          maxLength: 150
          minLength: 0
        startDate:
          type: string
          format: date
    CampusBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CampusDetailResponse:
      type: object
      properties:
        ageGroups:
          type: array
          items:
            $ref: "#/components/schemas/AgeGroupDetailResponse"
        campus:
          $ref: "#/components/schemas/CampusResponse"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/ClassBrief"
        kitchen:
          $ref: "#/components/schemas/Kitchen"
        schoolYearId:
          type: integer
          format: int64
        teachers:
          type: array
          items:
            $ref: "#/components/schemas/StaffBriefResponse"
        vicePrincipals:
          type: array
          items:
            $ref: "#/components/schemas/StaffBriefResponse"
    CampusRequest:
      type: object
      properties:
        address:
          type: string
          maxLength: 255
          minLength: 0
        code:
          type: string
          maxLength: 30
          minLength: 0
        isMain:
          type: boolean
        name:
          type: string
          maxLength: 150
          minLength: 0
        phone:
          type: string
          pattern: "\\s*((\\+?84|0)[\\s.\\-]*([35789]([\\s.\\-]?\\d){8}|2([\\s.\\\
            -]?\\d){9}))?\\s*"
        shortName:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - address
      - code
      - name
      - shortName
    CampusResponse:
      type: object
      properties:
        address:
          type: string
        childCount:
          type: integer
          format: int64
        classCount:
          type: integer
          format: int64
        code:
          type: string
        id:
          type: integer
          format: int64
        isMain:
          type: boolean
        name:
          type: string
        phone:
          type: string
        shortName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        vicePrincipals:
          type: array
          items:
            $ref: "#/components/schemas/StaffBriefResponse"
    CampusStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      required:
      - status
    Candidate:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
        campusIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
        fullName:
          type: string
        id:
          type: integer
          format: int64
        leadsAgeGroupId:
          type: integer
          format: int64
        leadsGroup:
          type: string
    ChangePassword:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
      required:
      - confirmPassword
      - currentPassword
      - newPassword
    ChildBrief:
