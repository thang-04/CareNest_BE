          format: int64
      - in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
