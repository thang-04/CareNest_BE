openapi: 3.1.0
info:
  description: REST API dùng chung cho CareNest web và mobile
  title: CareNest API
  version: v1
servers:
- description: Generated server url
  url: http://localhost
security:
- bearerAuth: []
paths:
  /api/accounts:
    post:
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCreateAccountResponse"
          description: Created
      tags:
      - account-controller
  /api/accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonMyAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/accounts/{userId}/status:
    patch:
      operationId: updateAccountStatus
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/auth/csrf:
    get:
      operationId: csrf
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCsrf"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Login successful
        "428":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Verified temporary password requires first-login setup
      security: []
      tags:
      - auth-controller
  /api/auth/logout:
    post:
      operationId: logout
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/forgot:
    post:
      operationId: forgot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Forgot"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}:
    get:
      operationId: otpMetadata
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/resend:
    post:
      operationId: resend
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/verify:
    post:
      operationId: verifyOtp
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonResetToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/reset:
    post:
      operationId: setPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reset"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/refresh:
    post:
      operationId: refresh
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccessToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/children/{childId}:
    get:
      operationId: getChildProfile
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonChildProfileResponse"
          description: OK
      tags:
      - child-controller
  /api/me/password:
    put:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      tags:
      - password-controller
components:
  schemas:
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    AccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    ChangePassword:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
      required:
      - confirmPassword
      - currentPassword
      - newPassword
    ChildProfileResponse:
      type: object
      properties:
        classroomId:
          type: integer
          format: int64
        dateOfBirth:
          type: string
          format: date
        fullName:
          type: string
        id:
          type: integer
          format: int64
    CreateAccountRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        fullName:
          type: string
          maxLength: 150
          minLength: 0
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        temporaryPassword:
          type: string
          maxLength: 128
          minLength: 8
        username:
          type: string
          maxLength: 100
          minLength: 3
          pattern: "^[A-Za-z0-9._-]+$"
      required:
      - fullName
      - role
      - username
    CreateAccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        setupEmailSent:
          type: boolean
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    Csrf:
      type: object
      properties:
        headerName:
          type: string
        token:
          type: string
    Forgot:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
      required:
      - email
    Login:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 1
        remember:
          type: boolean
      required:
      - identifier
      - password
    LoginData:
      type: object
      properties:
        accessToken:
          type: string
        account:
          $ref: "#/components/schemas/MyAccountResponse"
        changeToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        passwordChangeRequired:
          type: boolean
    MyAccountResponse:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/StaffAssignmentSummaryResponse"
        childIds:
          type: array
          items:
            type: integer
            format: int64
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - PRINCIPAL
            - VICE_PRINCIPAL
            - TEACHER
            - KITCHEN_STAFF
            - PARENT
        userId:
          type: integer
          format: int64
        username:
          type: string
    OtpRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        requestId:
          type: string
        resendAvailableAt:
          type: string
          format: date-time
    Refresh:
      type: object
      properties:
        force:
          type: boolean
    Reset:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
        token:
          type: string
          pattern: "[A-Za-z0-9_-]{43}"
      required:
      - confirmPassword
      - newPassword
      - token
    ResetToken:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        resetToken:
          type: string
    ResponseJsonAccessToken:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/AccessToken"
        desc:
          type: string
    ResponseJsonAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/AccountResponse"
        desc:
          type: string
    ResponseJsonChildProfileResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/ChildProfileResponse"
        desc:
          type: string
    ResponseJsonCreateAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/CreateAccountResponse"
        desc:
          type: string
    ResponseJsonCsrf:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/Csrf"
        desc:
          type: string
    ResponseJsonLoginData:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/LoginData"
        desc:
          type: string
    ResponseJsonMyAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/MyAccountResponse"
        desc:
          type: string
    ResponseJsonOtpRequest:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/OtpRequest"
        desc:
          type: string
    ResponseJsonResetToken:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/ResetToken"
        desc:
          type: string
    ResponseJsonVoid:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data: {}
        desc:
          type: string
    StaffAssignmentSummaryResponse:
      type: object
      properties:
        campusId:
          type: integer
          format: int64
        classroomId:
          type: integer
          format: int64
        staffRole:
          type: string
          enum:
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    UpdateAccountStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      required:
      - status
    VerifyOtp:
      type: object
      properties:
        otp:
          type: string
          pattern: "[0-9]{6}"
      required:
      - otp
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
