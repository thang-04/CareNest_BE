openapi: 3.1.0
info:
  description: REST API dùng chung cho CareNest web và mobile
  title: CareNest API
  version: v1
servers:
- description: Generated server url
  url: http://localhost
security:
- bearerAuth: []
paths:
  /api/accounts:
    post:
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCreateAccountResponse"
          description: Created
      tags:
      - account-controller
  /api/accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonMyAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/accounts/{userId}/status:
    patch:
      operationId: updateAccountStatus
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccountResponse"
          description: OK
      tags:
      - account-controller
  /api/ai-documents:
    get:
      operationId: listDocuments
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListAiDocumentResponse"
          description: OK
      tags:
      - ai-document-controller
    post:
      operationId: ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiDocumentRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAiDocumentResponse"
          description: OK
      tags:
      - ai-document-controller
  /api/ai-documents/{documentId}:
    delete:
      operationId: delete
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      tags:
      - ai-document-controller
  /api/ai-documents/{documentId}/reindex:
    post:
      operationId: reindex
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAiDocumentResponse"
          description: OK
      tags:
      - ai-document-controller
  /api/ai-documents/{documentId}/status:
    patch:
      operationId: changeStatus
      parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiDocumentStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAiDocumentResponse"
          description: OK
      tags:
      - ai-document-controller
  /api/auth/csrf:
    get:
      operationId: csrf
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonCsrf"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Login successful
        "428":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonLoginData"
          description: Verified temporary password requires first-login setup
      security: []
      tags:
      - auth-controller
  /api/auth/logout:
    post:
      operationId: logout
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/forgot:
    post:
      operationId: forgot
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Forgot"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}:
    get:
      operationId: otpMetadata
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/resend:
    post:
      operationId: resend
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonOtpRequest"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/otp/{requestId}/verify:
    post:
      operationId: verifyOtp
      parameters:
      - in: path
        name: requestId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtp"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonResetToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/password/reset:
    post:
      operationId: setPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reset"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/auth/refresh:
    post:
      operationId: refresh
      parameters:
      - in: cookie
        name: CARENEST_SESSION
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonAccessToken"
          description: OK
      security: []
      tags:
      - auth-controller
  /api/children/{childId}:
    get:
      operationId: getChildProfile
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonChildProfileResponse"
          description: OK
      tags:
      - child-controller
  /api/children/{childId}/observations:
    get:
      operationId: listChildObservations
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListObservationResponse"
          description: OK
      tags:
      - observation-controller
  /api/children/{childId}/summaries:
    get:
      operationId: listSummaries
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListChildSummaryResponse"
          description: OK
      tags:
      - child-summary-controller
  /api/children/{childId}/summaries/draft:
    post:
      operationId: createDraft
      parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSummaryDraftRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonChildSummaryResponse"
          description: OK
      tags:
      - child-summary-controller
  /api/classrooms/{classroomId}/observations:
    post:
      operationId: recordObservations
      parameters:
      - in: path
        name: classroomId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordObservationsRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonRecordObservationsResponse"
          description: OK
      tags:
      - observation-controller
  /api/me/password:
    put:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonVoid"
          description: OK
      tags:
      - password-controller
  /api/observation-criteria:
    get:
      operationId: listCriteria
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonListObservationCriteriaResponse"
          description: OK
      tags:
      - observation-controller
  /api/summaries/{summaryId}:
    put:
      operationId: updateContent
      parameters:
      - in: path
        name: summaryId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSummaryContentRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonChildSummaryResponse"
          description: OK
      tags:
      - child-summary-controller
  /api/summaries/{summaryId}/approve:
    post:
      operationId: approve
      parameters:
      - in: path
        name: summaryId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResponseJsonChildSummaryResponse"
          description: OK
      tags:
      - child-summary-controller
components:
  schemas:
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    AccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    AiDocumentResponse:
      type: object
      properties:
        chunkCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        documentType:
          type: string
          enum:
          - NUTRITION_STANDARD
          - FOOD_SAFETY_GUIDANCE
          - FOOD_SAFETY_ALERT
          - HEALTH_MONITORING_GUIDANCE
          - CHILD_DEVELOPMENT_STANDARD
          - SCHOOL_POLICY
          - SCHOOL_SOP
          - APPROVED_MENU
          - MENU_GUIDELINE
          - OTHER_REFERENCE
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        id:
          type: integer
          format: int64
        region:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        title:
          type: string
        version:
          type: string
    AiDraftView:
      type: object
      properties:
        areasForFollowUp:
          type: array
          items:
            $ref: "#/components/schemas/PointView"
        sources:
          type: array
          items:
            type: integer
            format: int64
        strengths:
          type: array
          items:
            $ref: "#/components/schemas/PointView"
        summary:
          type: string
    ChangePassword:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
      required:
      - confirmPassword
      - currentPassword
      - newPassword
    ChildProfileResponse:
      type: object
      properties:
        classroomId:
          type: integer
          format: int64
        dateOfBirth:
          type: string
          format: date
        fullName:
          type: string
        id:
          type: integer
          format: int64
    ChildSummaryResponse:
      type: object
      properties:
        aiDraft:
          $ref: "#/components/schemas/AiDraftView"
        aiErrorCode:
          type: string
        aiModel:
          type: string
        aiPromptVersion:
          type: string
        approvedAt:
          type: string
          format: date-time
        approvedBy:
          type: integer
          format: int64
        childId:
          type: integer
          format: int64
        content:
          type: string
        generatedAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        periodType:
          type: string
          enum:
          - WEEK
          - TERM
        source:
          type: string
          enum:
          - AI
          - TEMPLATE
        status:
          type: string
          enum:
          - DRAFT
          - APPROVED
    CreateAccountRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        fullName:
          type: string
          maxLength: 150
          minLength: 0
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        temporaryPassword:
          type: string
          maxLength: 128
          minLength: 8
        username:
          type: string
          maxLength: 100
          minLength: 3
          pattern: "^[A-Za-z0-9._-]+$"
      required:
      - fullName
      - role
      - username
    CreateAccountResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - PRINCIPAL
          - VICE_PRINCIPAL
          - TEACHER
          - KITCHEN_STAFF
          - PARENT
        setupEmailSent:
          type: boolean
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        userId:
          type: integer
          format: int64
        username:
          type: string
    CreateAiDocumentRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 200000
          minLength: 0
        documentType:
          type: string
          enum:
          - NUTRITION_STANDARD
          - FOOD_SAFETY_GUIDANCE
          - FOOD_SAFETY_ALERT
          - HEALTH_MONITORING_GUIDANCE
          - CHILD_DEVELOPMENT_STANDARD
          - SCHOOL_POLICY
          - SCHOOL_SOP
          - APPROVED_MENU
          - MENU_GUIDELINE
          - OTHER_REFERENCE
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        region:
          type: string
          maxLength: 50
          minLength: 0
          pattern: "^[A-Za-z_]*$"
        sourceName:
          type: string
          maxLength: 255
          minLength: 0
        sourceUrl:
          type: string
          maxLength: 1000
          minLength: 0
        title:
          type: string
          maxLength: 255
          minLength: 0
        version:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - content
      - documentType
      - effectiveDate
      - sourceName
      - title
    CreateSummaryDraftRequest:
      type: object
      properties:
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        periodType:
          type: string
          enum:
          - WEEK
          - TERM
      required:
      - periodFrom
      - periodTo
      - periodType
    Csrf:
      type: object
      properties:
        headerName:
          type: string
        token:
          type: string
    Entry:
      type: object
      properties:
        childId:
          type: integer
          format: int64
        note:
          type: string
          maxLength: 1000
          minLength: 0
        values:
          type: array
          items:
            $ref: "#/components/schemas/Value"
          maxItems: 30
          minItems: 0
      required:
      - childId
      - values
    Forgot:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
      required:
      - email
    Login:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 1
        remember:
          type: boolean
      required:
      - identifier
      - password
    LoginData:
      type: object
      properties:
        accessToken:
          type: string
        account:
          $ref: "#/components/schemas/MyAccountResponse"
        changeToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        passwordChangeRequired:
          type: boolean
    MyAccountResponse:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/StaffAssignmentSummaryResponse"
        childIds:
          type: array
          items:
            type: integer
            format: int64
        email:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - ADMIN
            - PRINCIPAL
            - VICE_PRINCIPAL
            - TEACHER
            - KITCHEN_STAFF
            - PARENT
        userId:
          type: integer
          format: int64
        username:
          type: string
    ObservationCriteriaResponse:
      type: object
      properties:
        code:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/OptionResponse"
    ObservationResponse:
      type: object
      properties:
        childId:
          type: integer
          format: int64
        classroomId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        note:
          type: string
        observedOn:
          type: string
          format: date
        values:
          type: array
          items:
            $ref: "#/components/schemas/ValueResponse"
    OptionResponse:
      type: object
      properties:
        code:
          type: string
        id:
          type: integer
          format: int64
        label:
          type: string
        score:
          type: integer
          format: int32
    OtpRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        requestId:
          type: string
        resendAvailableAt:
          type: string
          format: date-time
    PointView:
      type: object
      properties:
        evidenceIds:
          type: array
          items:
            type: string
        text:
          type: string
    RecordObservationsRequest:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
          maxItems: 60
          minItems: 0
        observedOn:
          type: string
          format: date
      required:
      - entries
      - observedOn
    RecordObservationsResponse:
      type: object
      properties:
        classroomId:
          type: integer
          format: int64
        observedOn:
          type: string
          format: date
        savedCount:
          type: integer
          format: int32
    Refresh:
      type: object
      properties:
        force:
          type: boolean
    Reset:
      type: object
      properties:
        confirmPassword:
          type: string
          maxLength: 128
          minLength: 8
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
        token:
          type: string
          pattern: "[A-Za-z0-9_-]{43}"
      required:
      - confirmPassword
      - newPassword
      - token
    ResetToken:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        resetToken:
          type: string
    ResponseJsonAccessToken:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/AccessToken"
        desc:
          type: string
    ResponseJsonAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/AccountResponse"
        desc:
          type: string
    ResponseJsonAiDocumentResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/AiDocumentResponse"
        desc:
          type: string
    ResponseJsonChildProfileResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/ChildProfileResponse"
        desc:
          type: string
    ResponseJsonChildSummaryResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/ChildSummaryResponse"
        desc:
          type: string
    ResponseJsonCreateAccountResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/CreateAccountResponse"
        desc:
          type: string
    ResponseJsonCsrf:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          $ref: "#/components/schemas/Csrf"
        desc:
          type: string
    ResponseJsonListAiDocumentResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiDocumentResponse"
        desc:
          type: string
    ResponseJsonListChildSummaryResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChildSummaryResponse"
        desc:
          type: string
    ResponseJsonListObservationCriteriaResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/ObservationCriteriaResponse"
        desc:
          type: string
    ResponseJsonListObservationResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/ObservationResponse"
        desc:
          type: string
    ResponseJsonLoginData:
      type: object
      properties:
        code:
          type: integer
          format: int32
