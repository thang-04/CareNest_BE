# VPS (k8selchat): CI chép file này + docker/ vào /data/thangnd/CAPSTONE/CareNest_BE rồi chạy
# `docker compose -f compose.vps.yaml up -d --no-build`; secret ở .env đặt tay (mẫu deploy/vps.env.example).
# VPS không tạo được network bridge ⇒ mọi service chạy mạng host, chỉ bind 127.0.0.1 (docs/system/DEPLOYMENT.md).
name: carenest-be

services:
  postgres:
    image: postgres:17-alpine
    network_mode: host
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      # Entrypoint, psql trong init script và pg_isready đều đọc PGPORT
      PGPORT: "18330"
      POSTGRES_DB: ${POSTGRES_DB:-carenest}
      POSTGRES_USER: ${POSTGRES_USER:-carenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deploy/vps.env.example}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required, see deploy/vps.env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE is set by CI, e.g. thangnd04/carenest-be:keycloak-<git-sha>}
    network_mode: host
    restart: unless-stopped
    # Không --optimized: KC_CACHE khác lúc build image ⇒ Keycloak tự build lại khi khởi động
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required, see deploy/vps.env.example}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:18330/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Caddy host giữ HTTPS, Keycloak chỉ nghe HTTP loopback
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: 127.0.0.1
      KC_HTTP_PORT: "18320"
      KC_HTTP_MANAGEMENT_PORT: "18321"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://auth.carenest.edu.vn
      # Admin console bị chặn ở Caddy; vào qua SSH tunnel `ssh -L 18320:127.0.0.1:18320`
      KC_HOSTNAME_ADMIN: http://localhost:18320
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # 1 node: tắt cluster để không mở cổng JGroups ra mọi địa chỉ trên mạng host
      KC_CACHE: local
      KC_HEALTH_ENABLED: "true"
      # Placeholder trong realm import (docker/keycloak/auth/generated/carenest-realm.json)
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required, see deploy/vps.env.example}
      KEYCLOAK_AUTH_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_AUTH_GATEWAY_CLIENT_SECRET:?KEYCLOAK_AUTH_GATEWAY_CLIENT_SECRET is required, see deploy/vps.env.example}
      KEYCLOAK_AUTH_RECOVERY_ASSERTION_SECRET: ${KEYCLOAK_AUTH_RECOVERY_ASSERTION_SECRET:?KEYCLOAK_AUTH_RECOVERY_ASSERTION_SECRET is required, see deploy/vps.env.example}
      CARENEST_WEB_ORIGIN: https://web.carenest.edu.vn
      CARENEST_AUTH_WEB_ORIGIN: https://web.carenest.edu.vn
      CARENEST_MOBILE_REDIRECT_URI: ${CARENEST_MOBILE_REDIRECT_URI:-carenest://oauth/callback}
      CARENEST_DEV_CLIENT_ENABLED: "false"
      # Mặc định Mailpit cùng VPS; SMTP thật thì đổi trong .env
      CARENEST_SMTP_HOST: ${CARENEST_SMTP_HOST:-127.0.0.1}
      CARENEST_SMTP_PORT: ${CARENEST_SMTP_PORT:-18340}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:?KEYCLOAK_DEV_USER_PASSWORD is required while dev users are imported}
    volumes:
      - ./docker/keycloak/auth/generated/carenest-realm.json:/opt/keycloak/data/import/carenest-realm.json:ro
      # User dev (khớp seed db/dev) chỉ cho giai đoạn demo; chuyển dữ liệu thật thì bỏ mount này
      - ./docker/keycloak/dev/carenest-users-0.json:/opt/keycloak/data/import/carenest-users-0.json:ro

  mailpit:
    image: axllent/mailpit:v1.31.4
    network_mode: host
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 127.0.0.1:18340
      MP_UI_BIND_ADDR: 127.0.0.1:18341

  api:
    image: ${API_IMAGE:?API_IMAGE is set by CI, e.g. thangnd04/carenest-be:api-<git-sha>}
    network_mode: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: "18310"
      DB_URL: jdbc:postgresql://127.0.0.1:18330/${POSTGRES_DB:-carenest}
      DB_USERNAME: ${POSTGRES_USER:-carenest}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_PREFIX: /api
      # Không dấu ":" ⇒ đặt rỗng trong .env là chạy không seed (chuyển dữ liệu thật)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-dev}
      KEYCLOAK_ISSUER_URI: https://auth.carenest.edu.vn/realms/carenest
      KEYCLOAK_JWK_SET_URI: http://127.0.0.1:18320/realms/carenest/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: carenest-api
      KEYCLOAK_BASE_URL: http://127.0.0.1:18320
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ACTIONS_EMAIL_ENABLED: "true"
      CARENEST_CORS_ALLOWED_ORIGINS: https://web.carenest.edu.vn
      # Gateway chỉ bật sau khi bootstrap.mjs --apply --enable (docs/system/DEPLOYMENT.md)
      CARENEST_AUTH_ENABLED: ${CARENEST_AUTH_ENABLED:-false}
      CARENEST_AUTH_ENCRYPTION_KEY: ${CARENEST_AUTH_ENCRYPTION_KEY:?CARENEST_AUTH_ENCRYPTION_KEY is required, see deploy/vps.env.example}
      KEYCLOAK_AUTH_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_AUTH_GATEWAY_CLIENT_SECRET}
      KEYCLOAK_AUTH_RECOVERY_ASSERTION_SECRET: ${KEYCLOAK_AUTH_RECOVERY_ASSERTION_SECRET}
      CARENEST_AUTH_SECURE_COOKIES: "true"
      CARENEST_AUTH_WEB_ORIGIN: https://web.carenest.edu.vn

volumes:
  postgres-data:
